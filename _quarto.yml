project:
  type: website
  output-dir: _site
  # Grafiken vor jedem Rendern neu erzeugen, marimo-Notebooks danach exportieren
  pre-render: werkzeuge/vor_render.py
  post-render: werkzeuge/nach_render.py
  render:
    - index.qmd
    - vorlesung/*.qmd
    - seminar/*.qmd
  resources:
    - assets/fonts/
    - assets/logos/

lang: de

# Lehrender (zentral, wird in Kopf- und Fußzeile verwendet)
dozent: "Prof. Dr.-Ing. Stephan Schönfelder"
dozent-url: "https://fing.htwk-leipzig.de/fakultaet/professuren/prof-stephan-schoenfelder"

website:
  title: "Technische Mechanik"
  page-navigation: true
  navbar:
    logo: assets/logos/htwk-schwarz.svg
    logo-alt: "HTWK Leipzig"
    left:
      - href: index.qmd
        text: Übersicht
      - text: Vorlesung
        menu:
          - href: vorlesung/00-mathematik.qmd
            text: "0 · Mathematische Werkzeuge"
          - href: vorlesung/01-grundlagen.qmd
            text: "1 · Kräfte, Momente, Gleichgewicht"
          - href: vorlesung/03-schnittgroessen.qmd
            text: "3 · Schnittgrößen"
      - text: Seminar
        menu:
          - href: seminar/01-grundlagen.qmd
            text: "1 · Kräfte, Momente, Gleichgewicht"
          - href: seminar/03-schnittgroessen.qmd
            text: "3 · Schnittgrößen"
    right:
      - text: "Prof. Dr.-Ing. Stephan Schönfelder"
        href: "https://fing.htwk-leipzig.de/fakultaet/professuren/prof-stephan-schoenfelder"
        target: _blank
  page-footer:
    center: |
      <div class="tm-fusszeile">
        <img src="/assets/logos/fakultaet-ing-schwarz.png" alt="Fakultät Ingenieurwissenschaften">
        <span>Technische Mechanik (M279) · <a href="https://fing.htwk-leipzig.de/fakultaet/professuren/prof-stephan-schoenfelder" target="_blank">Prof. Dr.-Ing. Stephan Schönfelder</a></span>
      </div>

format:
  html:
    theme: cosmo
    mainfont: "Source Sans Pro"
    css: assets/tm.css
    include-after-body: assets/scrolly.html
    html-math-method: mathjax
    toc: false

filters:
  - assets/scrolly.lua
