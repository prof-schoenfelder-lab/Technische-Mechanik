# Baut die Kursseite und veröffentlicht sie.
#
# Die Quellen (dieses Repository) bleiben privat. Veröffentlicht wird nur die fertige Seite
# (_site/) im öffentlichen Repository, das in der Repository-Variable ZIEL_REPO steht
# (z. B. prof-schoenfelder-lab/Technische-Mechanik-Web), Zweig gh-pages.
# Zugriff darauf über einen Deploy-Key: privater Schlüssel als Secret DEPLOY_KEY hier,
# öffentlicher Schlüssel mit Schreibrecht im Ziel-Repository.
#
# Musterlösungen werden beim Rendern aus _site entfernt (werkzeuge/nach_render.py)
# und daher nicht veröffentlicht.

name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: veroeffentlichen
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python-Pakete (marimo-Export, Grafiken)
        run: pip install marimo==0.25.1 numpy matplotlib

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Rendern
        run: quarto render

      - name: Kontrolle – keine Musterlösungen in der Seite
        run: |
          if ls _site/seminar/*-loesungen* 2>/dev/null; then
            echo "Musterlösung in _site gefunden – Abbruch"; exit 1
          fi

      - name: Seite als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: kursseite
          path: _site
          retention-days: 7

      - name: Veröffentlichen
        if: ${{ vars.ZIEL_REPO != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ vars.ZIEL_REPO }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
